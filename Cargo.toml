[package]
name = "warlogger"
version = "0.5.4"
edition = "2024"
rust-version = "1.85"
description = "Uploads combat logs to Warcraft Logs, FF Logs and the other RPGLogs sites"
license = "MIT"
publish = false

[features]
omarchy = []
portable = []

[dependencies]
memchr = "2"
miniz_oxide = "0.9"
rquickjs = { version = "0.14", default-features = false, features = ["std"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
